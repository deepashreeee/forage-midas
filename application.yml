general:
  kafka-topic: test-topic  # Kafka topic name

spring:
  kafka:
    bootstrap-servers: localhost:9092
    # Producer configuration (NEW - fixes SerializationException)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # Consumer configuration
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore"  # Allows Transaction deserialization

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true  # H2 console at http://localhost:8080/h2-console